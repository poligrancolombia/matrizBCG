<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matriz BCG — Portafolio Poli</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <div id="gate" class="flex min-h-screen items-center justify-center px-4">
    <form id="gate-form" class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-lg">
      <div class="mb-6 flex flex-col items-center gap-2.5 text-center">
        <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-slate-900 text-white text-lg font-bold">BCG</span>
        <h1 class="text-base font-bold tracking-tight text-slate-900">Matriz BCG — Portafolio Poli</h1>
        <p class="text-[12.5px] leading-relaxed text-slate-500">Ingresa la contraseña para ver la matriz de mercado.</p>
      </div>
      <input
        id="password"
        type="password"
        autofocus
        placeholder="Contraseña"
        class="w-full rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-[13.5px] outline-none focus:border-slate-400 focus:bg-white focus:ring-2 focus:ring-slate-200"
      />
      <p id="gate-error" class="hidden mt-2.5 text-[12.5px] font-medium text-rose-600"></p>
      <button
        id="gate-submit"
        type="submit"
        class="mt-5 w-full rounded-xl bg-slate-900 py-2.5 text-[13.5px] font-semibold text-white transition hover:bg-slate-800 disabled:opacity-50"
      >
        Entrar
      </button>
    </form>
  </div>

  <div id="app" class="hidden mx-auto max-w-[1400px] px-4 py-8">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Matriz BCG — Portafolio Poli</h1>
        <p class="text-sm text-slate-500">Mercado (SNIES, primer curso) vs. matrícula propia del Poli, por programa del portafolio.</p>
      </div>
      <nav class="flex gap-1 rounded-lg bg-slate-200/70 p-1">
        <button data-tab="graficos" class="tab-btn rounded-md px-3.5 py-1.5 text-sm font-semibold">Gráficos</button>
        <button data-tab="datos" class="tab-btn rounded-md px-3.5 py-1.5 text-sm font-semibold">Datos</button>
      </nav>
    </header>

    <section id="tab-graficos" class="tab-panel">
      <div class="mb-4 flex justify-end">
        <label class="text-sm font-medium text-slate-600">
          Segmento
          <select id="segmento" class="ml-2 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm">
            <option>Pregrado Virtual</option>
            <option>Pregrado Bogota</option>
            <option>Pregrado Medellin</option>
            <option>Posgrado Virtual</option>
            <option>Posgrado Bogota</option>
          </select>
        </label>
      </div>
      <div id="chart" class="h-[520px] w-full rounded-2xl bg-white p-2 shadow"></div>
      <p id="meta" class="mt-3 text-xs text-slate-400"></p>
    </section>

    <section id="tab-datos" class="tab-panel">
      <div class="mb-4 flex flex-wrap gap-3 rounded-2xl bg-white p-4 shadow">
        <div id="slicer-sede" class="relative"></div>
        <div id="slicer-nivel" class="relative"></div>
      </div>
      <div class="overflow-x-auto rounded-2xl bg-white shadow">
        <table id="tabla-datos" class="w-full whitespace-nowrap text-xs"></table>
      </div>
      <p id="meta-datos" class="mt-3 text-xs text-slate-400"></p>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
